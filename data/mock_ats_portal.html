<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Workday & Lever ATS Portal</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 24px; max-width: 700px; margin: auto; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="tel"], textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Application: Lead GenAI Architect</h1>
    <form id="application-form">
        <!-- Workday Stable Data-Automation-Id Elements -->
        <div class="form-group">
            <label>Upload Resume PDF</label>
            <input type="file" data-automation-id="file-upload-input" name="resume" />
        </div>
        <div class="form-group">
            <label>First Name</label>
            <input type="text" data-automation-id="legalNameSection_firstName" name="first_name" />
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input type="text" data-automation-id="legalNameSection_lastName" name="last_name" />
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" data-automation-id="email" name="email" />
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" data-automation-id="phone-number" name="phone" />
        </div>
        <div class="form-group">
            <label>City</label>
            <input type="text" data-automation-id="addressSection_city" name="city" />
        </div>
        <div class="form-group">
            <label>LinkedIn Profile URL</label>
            <input type="text" data-automation-id="linkedin-url" name="linkedin" />
        </div>
        <div class="form-group">
            <label>Expected Compensation / Salary</label>
            <input type="text" data-automation-id="salary-expectation" name="salary" />
        </div>
        <div class="form-group">
            <label>Relocation / Residency Availability</label>
            <textarea data-automation-id="relocation-availability" name="relocation"></textarea>
        </div>
        <div class="form-group">
            <label>Notice Period</label>
            <input type="text" data-automation-id="notice-period" name="notice" />
        </div>
        <button type="submit" data-automation-id="bottom-navigation-submit-button">Submit Application</button>
    </form>
</body>
</html>
