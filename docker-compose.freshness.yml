version: '3.8'

services:
  freshness-cron:
    build:
      context: .
      dockerfile: Dockerfile.freshness
    container_name: jobhunt_freshness_cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HEADLESS=true
      - TZ=Asia/Dubai
    volumes:
      # Mount sessions so cookies and login tokens persist across container restarts
      - ./sessions:/app/sessions
      # Mount logs for live inspection and screenshot verification
      - ./logs:/app/logs
      # Mount base profile data
      - ./data:/app/data
    command: ["--platform", "all", "--daemon"]
